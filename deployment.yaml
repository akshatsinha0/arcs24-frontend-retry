apiVersion: apps/v1
kind: Deployment
metadata:
  name: arcs24-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: arcs24
  template:
    metadata:
      labels:
        app: arcs24
    spec:
      containers:
      - name: arcs24
        image: 00akshatsinha00/arcs-frontend-retry:latest
        ports:
        - containerPort: 80
